# .github/workflows/main.yml
name: Upload wiki
on:
  gollum:
  workflow_dispatch:

jobs:
  gdrive-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki
        uses: actions/checkout@v2
        with:
            repository: 'freqva/test-gdrive-upload.wiki'
            ref: 'master'
            path: 'my-repo.wiki'

      - name: Build book
        run: |-
            npm install -g md-to-pdf
            mkdir -p _output
            cd my-repo.wiki
            echo; echo "Input Folder Listing"
            ls
            curl https://raw.githubusercontent.com/ekalinin/github-markdown-toc/master/gh-md-toc -o gh-md-toc
            chmod a+x gh-md-toc
            ./gh-md-toc README.md > README.md
            echo; echo "Generating PDF"
            for f in *.md; do cat $f; echo; done | md-to-pdf > ../_output/blue-paper.pdf
            cd ../_output
            echo; echo "Output Folder Listing"
            ls
            cd ..
  
      - name: Upload to gdrive
        uses: mathisve/gdrive-upload-action@b6fd5bd84f4d0d3f0bc04a555faee941c5aa8807
        with:
          filename: _output/blue-paper.pdf
          name: blue-paper.pdf
          folderId: "1D7Kh96ejmGy9gDOmiVcYMqkA4rIEJEZ0"
          credentials: ${{ secrets.wiki_upload_credentials }}
          encoded: false
